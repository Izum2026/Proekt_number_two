{% extends "index.html" %}

{% block content %}
<main class="page_main">
    <div id="menuContainer">
        <p style="text-align: center; padding: 40px; color: #888;">⏳ Загрузка меню...</p>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {

        const container = document.getElementById('menuContainer');
        async function loadMenu() {
            try {
                const response = await fetch('/api/menu');

                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                const categories = await response.json();
                if (!categories || categories.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#999;">Меню пусто</p>';
                    return;
                }

                container.innerHTML = '';
                categories.forEach(cat => {
                    const title = document.createElement('h2');
                    title.className = 'catalog_title';
                    title.textContent = cat.category;
                    container.appendChild(title);

                    const section = document.createElement('section');
                    section.className = 'container_catalog';
                    container.appendChild(section);

                    const list = document.createElement('ul');
                    list.className = 'catalog_list';
                    section.appendChild(list);

                    cat.items.forEach(item => {
                        const listItem = document.createElement('li');
                        listItem.className = 'catalog_item';
                        list.appendChild(listItem);

                        const img = document.createElement('img');
                        img.className = 'catalog_item_img';
                        img.width = 300;
                        img.height = 200;
                        img.src = `/static/images/${item.image}`;
                        img.alt = item.name;

                        listItem.appendChild(img);

                        const button = document.createElement('button');
                        button.textContent = 'В корзину';
                        button.className = 'add-to-cart';
                        button.dataset.id = item.id;
                        listItem.appendChild(button);

                        const nameP = document.createElement('p');
                        nameP.className = 'catalog_text';
                        nameP.textContent = item.name;
                        listItem.appendChild(nameP);

                        const priceP = document.createElement('p');
                        priceP.className = 'price';
                        priceP.textContent = `${item.price}₽`;
                        listItem.appendChild(priceP);
                    });
                });
            } catch (error) {
                console.error('ОШИБКА:', error);
                container.innerHTML = `<p style="text-align:center; color:red;">Ошибка: ${error.message}</p>`;
            }
        }
        container.addEventListener('click', function(event) {
        const button = event.target.closest('.add-to-cart');
        if (!button) return;

        const itemId = button.dataset.id;

        fetch('/api/cart', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, quantity: 1 })
        })
        .then(response => response.json())
        .then(data => {
            console.log('Добавлено!', data);
        })
        .catch(error => {
            console.error('Ошибка:', error);
        });
    });
        loadMenu();
    });
</script>

{% endblock %}
